name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Deploy the image for the selected main commit to production
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and push immutable image
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy selected commit to VPS
    if: github.event_name == 'workflow_dispatch' && inputs.confirm_deploy == true
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out selected commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require main branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Deploy is allowed only from main." >&2
            exit 1
          fi

      - name: Configure strict SSH host verification
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Upload production Compose file
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            'install -d -m 750 /opt/telegram-bot'
          scp -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            compose.production.yaml \
            "$SSH_USER@$SSH_HOST:/opt/telegram-bot/compose.production.yaml"

      - name: Validate VPS configuration
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          cd /opt/telegram-bot
          if [[ ! -f .env ]]; then
            echo "/opt/telegram-bot/.env does not exist." >&2
            exit 1
          fi
          postgres_password="$(sed -n 's/^POSTGRES_PASSWORD=//p' .env | tail -n 1 | tr -d '\r')"
          if [[ -z "${postgres_password//[[:space:]\"\']/}" ]]; then
            echo "POSTGRES_PASSWORD is missing or empty in /opt/telegram-bot/.env." >&2
            exit 1
          fi
          if ! docker volume inspect bot-superpower_postgres_data >/dev/null 2>&1; then
            echo "Required volume bot-superpower_postgres_data does not exist; refusing deploy." >&2
            exit 1
          fi
          if ! docker image inspect postgres:17-alpine >/dev/null 2>&1; then
            echo "postgres:17-alpine is not present; pre-pull it manually before first deploy." >&2
            exit 1
          fi
          REMOTE

      - name: Pull immutable bot image only
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          image="${IMAGE,,}"
          printf '%s' "$GHCR_TOKEN" | ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "docker login ghcr.io --username '$GITHUB_ACTOR' --password-stdin && \
             cd /opt/telegram-bot && \
             BOT_IMAGE='$image' docker compose --project-name bot-superpower \
               --env-file .env -f compose.production.yaml pull bot && \
             docker logout ghcr.io"

      - name: Start services without building
        shell: bash
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: |
          image="${IMAGE,,}"
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "cd /opt/telegram-bot && \
             BOT_IMAGE='$image' docker compose --project-name bot-superpower \
               --env-file .env -f compose.production.yaml up -d --no-build --pull never && \
             BOT_IMAGE='$image' docker compose --project-name bot-superpower \
               --env-file .env -f compose.production.yaml ps"
