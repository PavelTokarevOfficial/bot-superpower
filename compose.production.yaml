name: bot-superpower

services:
  bot:
    image: ${BOT_IMAGE:?BOT_IMAGE must be an immutable GHCR image tag}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://bot:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/bot_superpower
      TZ: Europe/Kirov
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.50

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: bot_superpower
      POSTGRES_USER: bot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      TZ: Europe/Kirov
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=20
      - -c
      - timezone=Europe/Kirov
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bot -d bot_superpower"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 256m
    cpus: 0.50

volumes:
  postgres_data:
    name: bot-superpower_postgres_data
